# =============================================================
# ElytrixAuth — конфигурация (key=value, UTF-8)
# Файл создаётся автоматически при первом запуске в папке
# plugins/ElytrixAuth/ — править там, потом перезапуск прокси.
# =============================================================

# --- База данных (встроенная HSQLDB) ---
# Файл БД. Если путь относительный — считается от папки плагина
# (plugins/ElytrixAuth/). Таблицы создаются сами при запуске,
# ничего устанавливать не нужно.
db.file=db/elytrix

# --- Сервера (имена из config.yml NullCordX) ---
# auth.server     — куда попадают неавторизованные (сервер с лобби/капчой-картой)
# target.server   — куда переводить после успешного входа
# auth.force.server — вести неавторизованных на auth принудительно (true).
#   Если маршрут на auth уже делает сам прокси/капча (NullCordX) и при true вход
#   рвётся — поставь false.
auth.server=auth
target.server=grief
auth.force.server=true

# --- Сценарий входа (не менять без указания разработчика) ---
# entry.sync-db — читать аккаунт из БД в PostLogin синхронно (true, как в рабочей
#   версии). false — в фоне, не держа поток событий прокси.
# entry.ui-immediate — показывать первый UI (приветствие/боссбар/title) сразу при
#   подключении к серверу (true, как в рабочей версии). false — отложить на 2.5с.
entry.sync-db=true
entry.ui-immediate=true

# --- Авторизация ---
# Время на регистрацию/вход до кика, сек
login.timeout.seconds=180
# Неверных попыток /login за окно (считается отдельно по нику и по IP),
# после — кик «слишком много попыток»
max.failed.tries=5
failed.window.seconds=60
# Мин. длина пароля
min.password.length=4

# --- Защита от ботов и перебора ---
# Временный бан IP после N неверных входов с него за окно (0 — выключено).
# Пример: бот перебирает пароли -> после 3 ошибок его IP банится на 30 мин,
# и даже перезаход не поможет, пока бан не истечёт.
ban.ip.after.tries=3
ban.ip.minutes=30
# Сколько аккаунтов можно зарегистрировать с одного IP (0 — без лимита).
# Пример: 3 — четвёртый аккаунт с этого IP зарегистрировать нельзя.
reg.max.per.ip=3
# Сколько игроков может быть онлайн одновременно с одного IP (0 — без лимита).
# Пример: 3 — четвёртый с этого IP не зайдёт, пока кто-то не выйдет.
online.max.per.ip=3

# --- Сессии (вход без пароля после перезахода) ---
# Если игрок зашёл повторно в течение session.max.seconds с того же IP —
# пароль не спрашиваем, пускаем сразу.
# sessions.enabled  — вкл/выкл сессии целиком
# session.max.seconds — сколько секунд живёт сессия (по умолчанию 6 часов = 21600)
# session.check.ip  — строгая проверка: с другого IP сессия не действует,
#                     спрашиваем пароль (рекомендуется true)
sessions.enabled=true
session.max.seconds=21600
session.check.ip=true

# --- Telegram-привязка ---
# Срок жизни кода /addtg, сек
link.code.ttl.seconds=300
# Срок жизни запроса 2FA (кнопка в боте), сек
login2fa.ttl.seconds=90
# Юзернейм Telegram-бота без @ (для кликабельной ссылки в сообщении /addtg)
tg.bot.username=Elytrixbot

# --- HTTP-API для Telegram-бота (бот НЕ ходит в БД, только сюда) ---
# Порт, на котором плагин слушает запросы бота. В firewall VDS открой его
# для IP хостинга бота (или для всех — доступ всё равно защищён api.secret).
api.port=8754

# Группы LuckPerms = привилегия Elder (раздел бота «Активные ивенты»)
elder.groups=elder
# Секретный ключ: если пусто/CHANGE_ME — сгенерируется сам при первом запуске,
# значение напечатается в консоль. Скопируй его в .env бота как API_KEY.
api.secret=
# Слушать на всех интерфейсах (0.0.0.0), чтобы бот мог достучаться с другого хостинга
api.bind=0.0.0.0
