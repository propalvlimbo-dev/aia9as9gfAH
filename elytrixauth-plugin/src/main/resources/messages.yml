# =============================================================
# ElytrixAuth — сообщения плагина.
# Стиль сервера ElytriX: розовый &#F8BEFB, разделители ┃, маркеры ●.
# Файл пересоздаётся при удалении и перезапуске прокси.
# Плейсхолдеры: {prefix}, {player}, {min}, {timeout}, {sec}, {ttl}, {code}, {left}
# =============================================================

prefix: '&f☁ &#F8BEFBᴇ&#F6BEFBʟ&#F3BEFBʏ&#F1BFFBᴛ&#EEBFFBʀ&#ECBFFBɪ&#E9BFFBx &7»'

# ---------- экран при входе (title по центру, видно при выключенном чате) ----------

join-title-reg: '&#F8BEFBРегистрация'
join-subtitle-reg: '&fКоманда: &#F8BEFB/reg &7<пароль> <пароль>'
join-title-login: '&#F8BEFBВход'
join-subtitle-login: '&fКоманда: &#F8BEFB/login &7<пароль>'

# Первое сообщение при заходе (аккаунта нет в базе)
join-msg-reg:
  - ''
  - '{prefix} &#F8BEFBРегистрация'
  - '&#F8BEFB┃ &fТебя нет в базе &7— создай аккаунт'
  - '&#F8BEFB┃ &fКоманда: &#F8BEFB/reg &7<пароль> <пароль>'
  - '&#F8BEFB┃ &fПароль: &7от &f{min}&7 символов'
  - '&7● &fВремя на регистрацию: &#F8BEFB{timeout}&7 сек'
  - ''

# Первое сообщение при заходе (аккаунт есть — нужен пароль)
join-msg-login:
  - ''
  - '{prefix} &#F8BEFBВход'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fКоманда: &#F8BEFB/login &7<пароль>'
  - '&#F8BEFB┃ &fВремя: &#F8BEFB{timeout}&7 сек'
  - ''

# Сессия была, но IP сменился — перед сообщением входа
session-ip-changed:
  - '{prefix} &cСессия сброшена'
  - '&#F8BEFB┃ &fПричина: &cизменился IP'
  - '&#F8BEFB┃ &fДействие: &7введи пароль ещё раз'

# Автовход по активной сессии (тот же IP, срок не истёк)
auto-login:
  - ''
  - '{prefix} &aАвтовход'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fСтатус: &aсессия активна'
  - '&7● &fПриятной игры! &#F8BEFBelytrix.pw'
  - ''

# ---------- напоминания в чат (раз в 10 сек, пока не авторизован) ----------

remind-reg: '{prefix} &#F8BEFBРегистрация &7• &fосталось: &#F8BEFB{sec}&7 сек &8| &#F8BEFB/reg &7<пароль> <пароль>'
remind-login: '{prefix} &#F8BEFBВход &7• &fосталось: &#F8BEFB{sec}&7 сек &8| &#F8BEFB/login &7<пароль>'

# ---------- подсказки над хотбаром (actionbar) ----------

actionbar-reg: '&fРегистрация: &#F8BEFB/reg &7<пароль> <пароль>'
actionbar-login: '&fВход: &#F8BEFB/login &7<пароль>'
actionbar-tg: '&fПодтверждение: &#F8BEFBTelegram &7— кнопка &a«Войти»'
actionbar-authed: '&aДобро пожаловать, &f{player}&a!'

# ---------- bossbar с таймером ----------

bossbar-auth: '&#F8BEFBАвторизация &7• &fосталось: &#F8BEFB{sec}&7 сек'
bossbar-tg: '&#F8BEFBПодтверждение в Telegram &7• &fосталось: &#F8BEFB{sec}&7 сек'

# ---------- кики ----------

kick-timeout-reg: '&#F8BEFBРегистрация\n\n&cВремя вышло — ты не успел создать аккаунт\n\n&7Зайди заново и введи:\n&#F8BEFB/reg <пароль> <пароль>'
kick-timeout-login: '&#F8BEFBВход\n\n&cВремя вышло — ты не успел войти\n\n&7Зайди заново и введи:\n&#F8BEFB/login <пароль>'
kick-too-many-tries: '&#F8BEFBВход заблокирован\n\n&cСлишком много неверных попыток\n\n&7Подожди немного и зайди снова'
kick-denied: '&#F8BEFBВход отклонён\n\n&cОтклонено в Telegram\n\n&7Если это был ты — зайди и попробуй ещё раз'

# ---------- блокировки чата и команд ----------

chat-blocked-reg: '{prefix} &7Чат откроется после регистрации: &#F8BEFB/reg &7<пароль> <пароль>'
chat-blocked-login: '{prefix} &7Чат откроется после входа: &#F8BEFB/login &7<пароль>'
cmd-blocked-reg: '{prefix} &cКоманда недоступна &7• сначала &fзарегистрируйся&7: &#F8BEFB/reg &7<пароль> <пароль>'
cmd-blocked-login: '{prefix} &cКоманда недоступна &7• сначала &fвойди&7: &#F8BEFB/login &7<пароль>'

# ---------- ошибки ----------

cmd-only-player: '{prefix} &cКоманда доступна только игроку'
usage-reg: '{prefix} &fИспользование: &#F8BEFB/reg &7<пароль> <пароль>'
usage-login: '{prefix} &fИспользование: &#F8BEFB/login &7<пароль>'
already-authed: '{prefix} &cТы уже авторизован'
db-error: '{prefix} &cОшибка базы данных &7— попробуй ещё раз'
pass-mismatch: '{prefix} &cПароли не совпадают &7— введи пароль дважды одинаково'
pass-short: '{prefix} &cПароль слишком короткий &8(&7минимум &f{min}&8)'
pass-long: '{prefix} &cПароль слишком длинный &8(&7максимум &f{max}&8)'
not-registered: '{prefix} &cАккаунт не найден &7— сначала &fзарегистрируйся&7: &#F8BEFB/reg &7<пароль> <пароль>'
account-exists: '{prefix} &cАккаунт уже существует &7— войди: &#F8BEFB/login &7<пароль>'
wrong-password: '{prefix} &cНеверный пароль &8(&7осталось &f{left}&8)'
wrong-password-unknown: '{prefix} &cНеверный пароль'

# ---------- успех ----------

register-ok:
  - ''
  - '{prefix} &aРегистрация успешна'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fСтатус: &aаккаунт создан'
  - '&7● &fПриятной игры! &#F8BEFBelytrix.pw'
  - ''

login-ok:
  - ''
  - '{prefix} &aВход выполнен'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fСтатус: &aавторизован'
  - '&7● &fПриятной игры! &#F8BEFBelytrix.pw'
  - ''

# ---------- вход с подтверждением в Telegram ----------

tg-wait-confirm:
  - '{prefix} &aПароль верный'
  - '&#F8BEFB┃ &fСтатус: &aожидает подтверждения'
  - '&7● &fОткрой Telegram и нажми &a«Войти»&7 • &f{ttl}&7 сек'

tg-confirmed:
  - ''
  - '{prefix} &aВход подтверждён'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fСтатус: &aавторизован в Telegram'
  - '&7● &fПриятной игры! &#F8BEFBelytrix.pw'
  - ''

tg-expired: '{prefix} &cВремя подтверждения истекло &7— введи &#F8BEFB/login &7ещё раз'
tg-already: '{prefix} &7Пароль уже принят &7— жди кнопку &a«Войти»&7 в &fTelegram'

# ---------- подсказка про Telegram (после входа, если не привязан) ----------

hint-tg:
  - ''
  - '{prefix} &#F8BEFBЗащита аккаунта'
  - '&#F8BEFB┃ &fСтатус: &7Telegram не привязан'
  - '&#F8BEFB┃ &fКоманда: &#F8BEFB/addtg'
  - '&7● &fВход с подтверждением в Telegram &8| &#F8BEFBelytrix.pw'
  - ''

# ---------- привязка Telegram (/addtg) ----------

addtg-not-authed: '{prefix} &cСначала войди: &#F8BEFB/login &7<пароль>'
addtg-db-error: '{prefix} &cНе удалось создать код &7— попробуй ещё раз'
addtg-msg:
  - ''
  - '{prefix} &#F8BEFBПривязка Telegram'
  - '&#F8BEFB┃ &fКод: &#F8BEFB{code}'
  - '&#F8BEFB┃ &fДействие: &7отправь боту &f/link {code}'
  - '&#F8BEFB┃ &fСрок: &#F8BEFB{ttl}&7 сек'
  - '&7● &fСначала напиши боту любое сообщение'
  - ''

tg-linked:
  - ''
  - '{prefix} &aTelegram привязан'
  - '&#F8BEFB┃ &fИгрок: &#F8BEFB{player}'
  - '&#F8BEFB┃ &fСтатус: &aаккаунт защищён'
  - '&7● &fВход: &#F8BEFB/login &7+ кнопка &a«Войти»&7 в Telegram'
  - ''
