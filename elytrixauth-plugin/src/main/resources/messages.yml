# =============================================================
# ElytrixAuth — сообщения плагина (пересоздаётся при удалении файла
# и перезапуске прокси). Правишь — перезапускаешь прокси.
#
# Только обычные &-коды (&d &f &7 &a &c &l и т.д.).
# ВАЖНО: НЕ используй &#RRGGBB — на части прокси hex-цвета ломают
# первые буквы строки. {prefix} = префикс, остальные {...}
# подставляются плагином.
# =============================================================

prefix: '&8[&dElytriX&8] &7»'

# ---------- экран при входе (title в центре экрана) ----------

join-title-reg: '&d&lРегистрация'
join-subtitle-reg: '&fВведи пароль дважды: &d/reg <пароль> <пароль>'
join-title-login: '&d&lВход'
join-subtitle-login: '&fВведи пароль: &d/login <пароль>'

# Первое сообщение в чате при заходе
# {timeout} — секунд на авторизацию
join-msg-reg:
  - '{prefix} &fТебя нет в базе — создай пароль:'
  - '  &d/reg <пароль> <пароль>'
  - '&7На регистрацию даётся &f{timeout}&7 секунд'
join-msg-login:
  - '{prefix} &fС возвращением, &d{player}&f! Введи пароль:'
  - '  &d/login <пароль>'
  - '&7На вход даётся &f{timeout}&7 секунд'

# Сессия была, но IP сменился
session-ip-changed: '{prefix} &cСессия сброшена &8(&7изменился IP&8)&7 — введи пароль заново'

# Автовход по сессии (тот же IP, срок не истёк)
auto-login:
  - '{prefix} &aАвтовход выполнен'
  - '&fДобро пожаловать, &d{player}&a! Приятной игры.'

# Напоминания в чате, пока игрок не авторизован (раз в 10 сек)
# {sec} — сколько осталось
remind-reg: '{prefix} &fРегистрация: &d/reg <пароль> <пароль> &8• &7осталось &f{sec}&7 сек'
remind-login: '{prefix} &fВход: &d/login <пароль> &8• &7осталось &f{sec}&7 сек'

# ---------- подсказки над хотбаром (actionbar) ----------

actionbar-reg: '&fРегистрация: &d/reg <пароль> <пароль>'
actionbar-login: '&fВход: &d/login <пароль>'
actionbar-tg: '&fПодтверди вход в &dTelegram&f: нажми кнопку &a«Войти»'
actionbar-authed: '&aДобро пожаловать, &f{player}&a!'

# ---------- пурпурный bossbar с таймером ----------

bossbar-auth: '&dАвторизация &7• &fосталось: &f{sec}&7 сек'
bossbar-tg: '&dПодтверждение в Telegram &7• &fосталось: &f{sec}&7 сек'

# ---------- кики ----------

kick-timeout-reg: '&cВремя вышло\n\n&fТы не зарегистрировался.\n\n&7Зайди заново и введи:\n&d/reg <пароль> <пароль>'
kick-timeout-login: '&cВремя вышло\n\n&fТы не вошёл.\n\n&7Зайди заново и введи:\n&d/login <пароль>'
kick-too-many-tries: '&cВход заблокирован\n\n&fСлишком много неверных попыток.\n\n&7Подожди немного и зайди снова'
kick-denied: '&cВход отклонён\n\n&fТы отклонил вход в Telegram.\n\n&7Если это был ты — зайди и попробуй ещё раз'

# ---------- блокировки чата и команд ----------

chat-blocked-reg: '{prefix} &7Чат откроется после регистрации: &d/reg <пароль> <пароль>'
chat-blocked-login: '{prefix} &7Чат откроется после входа: &d/login <пароль>'
cmd-blocked-reg: '{prefix} &cСначала зарегистрируйся: &d/reg <пароль> <пароль>'
cmd-blocked-login: '{prefix} &cСначала войди: &d/login <пароль>'

# ---------- ошибки ----------

cmd-only-player: '{prefix} &cКоманда доступна только игроку'
usage-reg: '{prefix} &fИспользование: &d/reg <пароль> <пароль>'
usage-login: '{prefix} &fИспользование: &d/login <пароль>'
already-authed: '{prefix} &cТы уже авторизован'
db-error: '{prefix} &cОшибка базы данных. Попробуй ещё раз'
pass-mismatch: '{prefix} &cПароли не совпадают. &7Введи пароль дважды одинаково'
pass-short: '{prefix} &cПароль слишком короткий &8(&7минимум &f{min}&7&8)'
pass-long: '{prefix} &cПароль слишком длинный &8(&7максимум &f{max}&7&8)'
not-registered: '{prefix} &cТакого аккаунта нет. &7Сначала зарегистрируйся: &d/reg <пароль> <пароль>'
account-exists: '{prefix} &cАккаунт уже существует. &7Войди: &d/login <пароль>'
wrong-password: '{prefix} &cНеверный пароль &8(&7осталось &f{left}&7&8)'
wrong-password-unknown: '{prefix} &cНеверный пароль'

# ---------- успех ----------

register-ok: '{prefix} &aРегистрация успешна! &fДобро пожаловать, &d{player}&a!'
login-ok: '{prefix} &aВход выполнен! &fПриятной игры, &d{player}&a!'

# ---------- вход с подтверждением в Telegram ----------

tg-wait-confirm:
  - '{prefix} &aПароль верный!'
  - '&7Открой &dTelegram&7 и нажми &a«Войти»&7. &8(&f{ttl}&7 сек&8)'
tg-confirmed: '{prefix} &aВход подтверждён в Telegram! &fПриятной игры, &d{player}&a!'
tg-expired: '{prefix} &cВремя подтверждения истекло. &7Введи &d/login &7ещё раз'
tg-already: '{prefix} &7Пароль принят — жди кнопку «Войти» в &dTelegram&7'

# ---------- подсказка про Telegram (после входа, если не привязан) ----------

hint-tg:
  - '{prefix} &7Защити аккаунт: &d/addtg &7— вход с подтверждением в &dTelegram&7'

# ---------- привязка Telegram (/addtg) ----------

addtg-not-authed: '{prefix} &cСначала войди: &d/login <пароль>'
addtg-db-error: '{prefix} &cНе удалось создать код. Попробуй ещё раз'
addtg-msg:
  - '{prefix} &dПривязка Telegram'
  - '&7Код: &d{code}'
  - '&7Отправь его боту: &d/link {code}'
  - '&7Код действует &f{ttl}&7 сек. Сначала напиши боту любое сообщение.'
tg-linked:
  - '{prefix} &aTelegram привязан к &d{player}&a!'
  - '&7Теперь вход: &d/login &7+ кнопка &a«Войти»&7 в Telegram.'
