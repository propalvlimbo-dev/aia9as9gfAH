name: build-elytrixauth
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Получить hsqldb.jar (HSQLDB 2.3.2, как в lib/)
        run: |
          mkdir -p elytrixauth-plugin/lib
          curl -sL -o /tmp/hsqldb.jar \
            https://repo1.maven.org/maven2/org/hsqldb/hsqldb/2.3.2/hsqldb-2.3.2.jar
          cp /tmp/hsqldb.jar elytrixauth-plugin/lib/hsqldb.jar

      - name: Собрать jar
        run: bash elytrixauth-plugin/build.sh

      - name: Проверить версию (E2E smoke: создать/закрыть БД)
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > Smoke.java <<'EOF'
          import ru.elytrix.auth.*;
          import java.io.*;
          import java.util.logging.*;
          public class Smoke {
            public static void main(String[] a) throws Exception {
              Logger log = Logger.getLogger("s"); log.setUseParentHandlers(false);
              File dir = new File("/tmp/smoke/plug"); dir.mkdirs();
              try (Writer w = new OutputStreamWriter(new FileOutputStream(new File(dir, "config.properties")), "UTF-8")) {
                w.write("db.file=db/elytrix\n");
              }
              Database db = new Database(dir, new PluginConfig(new File(dir, "config.properties")), log);
              db.createPlayer(java.util.UUID.randomUUID(), "Smoke", "h", "1.1.1.1", 1L);
              db.close();
              System.out.println("SMOKE-OK");
            }
          }
          EOF
          javac -encoding UTF-8 -cp /home/runner/work/aia9as9gfAH/aia9as9gfAH/elytrixauth-plugin/dist/ElytrixAuth-1.0.0.jar Smoke.java
          java -cp /home/runner/work/aia9as9gfAH/aia9as9gfAH/elytrixauth-plugin/dist/ElytrixAuth-1.0.0.jar:/tmp/smoke Smoke

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ElytrixAuth-jar
          path: elytrixauth-plugin/dist/ElytrixAuth-1.0.0.jar
